name: IPL Auction Docker CI

on:
  push:
    branches:
      - main
      - develop
      - beta
      - prod
  pull_request:
    branches:
      - main
      - develop
      - beta
      - prod

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 3: Build and start containers
    - name: Build and run Docker Compose
      run: |
        docker compose up -d --build

    # Step 4: Wait for services to be ready
    - name: Wait for MySQL
      run: |
        echo "Waiting for MySQL to be ready..."
        for i in {1..30}; do
          if docker compose exec -T db mysqladmin ping -h localhost -u root -proot --silent; then
            echo "MySQL is ready!"
            break
          fi
          sleep 2
        done

    # Step 5: Run migrations
    - name: Run migrations
      run: |
        docker compose exec -T web python manage.py migrate

    # Step 6: Run tests
    - name: Run tests
      run: |
        docker compose exec -T web python manage.py test --verbosity=2

    # Step 7: Test API endpoints
    - name: Test API endpoints
      run: |
        # Wait for web service
        sleep 5
        curl -s http://localhost:8000/api/players/ || true
        curl -s http://localhost:8000/api/teams/ || true

    # Step 8: Build Docker image for registry
    - name: Build Docker image
      run: |
        docker build -t ipl-auction:${{ github.sha }} .
        docker tag ipl-auction:${{ github.sha }} ipl-auction:latest

    # Step 9: Cleanup
    - name: Cleanup
      if: always()
      run: |
        docker compose down -v

  # Optional: Push to registry (only on main branch)
  push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      run: |
        docker build -t ipl-auction:${{ github.sha }} .

